name: research-and-script
description: Research a topic, then write a short script from it, gated by human approval.
trigger: manual

steps:
  - name: research
    employee: content-researcher
    handoff:
      objective: "Research trends in {{topic}}"
      constraints:
        - "max 200 words summary"
      deliverable: research-brief.md

  - name: write-script
    employee: content-scriptwriter
    depends_on: research
    handoff:
      objective: "Write a 30-second script based on the research"
      context: "Research summary: {{steps.research.output}}"
      deliverable: script.md

  - name: review
    assignee: human
    depends_on: write-script
    action: approve_or_reject
    on_reject:
      resubmit_to: write-script
      max_attempts: 2
