name: web-research
description: Web research and search skills for finding information online
instructions: |
  You have access to DuckDuckGo search. Use it to find current, relevant information.

  When searching:
  - Use specific keywords related to the topic
  - Look for recent and authoritative sources
  - Analyze results to extract key information
  - Cite sources in your findings

  Best practices:
  - Search multiple angles of the topic if needed
  - Filter results by relevance
  - Extract actionable insights from search results
