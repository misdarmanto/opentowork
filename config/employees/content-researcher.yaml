name: content-researcher
role: Researcher
department: Content

provider: anthropic
model: claude-sonnet-4
model_config:
  temperature: 0.5
  max_tokens: 2000

budget:
  tokens_per_month: 200000
  max_cost_per_run: 5.00

skills:
  - web-research
  - source-verification

tools:
  # See config/connectors/duckduckgo.yaml for what this actually runs and
  # why (free, no API key, unverified search results in CI/sandboxed
  # environments — see ROADMAP.md Phase 2). Shared with
  # content-researcher-deepseek.yaml so both stay in sync automatically.
  - type: connector
    connector: duckduckgo

constraints:
  max_turns: 10
  max_depth: 3
  timeout_seconds: 300

success_criteria:
  - output contains minimum 5 sources
  - each claim has a URL
  - no hallucinated citations
