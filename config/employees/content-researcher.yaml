name: content-researcher
role: Researcher
department: Content

provider: anthropic
model: claude-sonnet-4
model_config:
  temperature: 0.5
  max_tokens: 2000

budget:
  tokens_per_month: 200000
  max_cost_per_run: 5.00

skills:
  - web-research
  - source-verification

tools:
  # Free, no API key — scrapes DuckDuckGo's HTML search. Verified to connect
  # and expose duckduckgo_web_search correctly via the MCP protocol; actual
  # search results are unverified in CI/sandboxed environments because DDG
  # anomaly-blocks datacenter IPs (see ROADMAP.md Phase 2). Works from most
  # residential/personal-machine IPs.
  - type: mcp
    name: duckduckgo
    command: npx
    args: ["-y", "duckduckgo-mcp-server"]

constraints:
  max_turns: 10
  max_depth: 3
  timeout_seconds: 300

success_criteria:
  - output contains minimum 5 sources
  - each claim has a URL
  - no hallucinated citations
